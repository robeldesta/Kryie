[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyrie"
version = "0.1.0"
description = "A small code language model trained from scratch"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy",
    "tokenizers>=0.19",
    "datasets>=2.20",
]

[project.optional-dependencies]
dev = ["pytest"]
wandb = ["wandb"]

[tool.setuptools.packages.find]
include = ["kyrie*"]

[tool.setuptools.package-data]
kyrie = ["web/*.html"]
